<html lang="da"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udsolgt - Soundboks 4</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f9;
            --error-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            box-sizing: border-box;
            text-align: center;
        }

        .status-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #ccc;
        }

        h1 { margin-top: 0; font-size: 24px; color: #2c3e50; }
        p { line-height: 1.6; color: #666; font-size: 16px; margin-bottom: 30px; }

        .status-badge {
            display: inline-block;
            background-color: #fff3cd;
            color: #856404;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
        }

        .back-btn {
            display: inline-block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 16px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }

        .contact-info {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-icon">📢</div>
        <div class="status-badge">Ikke tilgængelig</div>
        
        
        
        

        

        <p>Vi kan desværre ikke tage imod nye bookinger lige nu. Dette skyldes enten, at alt udstyr er udlejet, eller at vi udfører nødvendig vedligeholdelse for at sikre, at lyden spiller perfekt til næste fest.</p>
        <a href="https://www.keeva.dk/shop" class="back-btn" target="_blank">Se udvalg</a>
<div class="contact-info">
            Spørgsmål til fremtidige bookinger?<br>
             <a href="https://www.keeva.dk/contactus" target="_blank"><strong>Kontakt os</strong></a>
        </div>
    </div>


</body></html>
