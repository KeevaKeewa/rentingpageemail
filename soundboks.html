<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ==================== CONFIG SECTION ==================== -->
<script>
const CONFIG = {
  pageTitle: "Leje Soundboks 4",
  itemName: "Soundboks 4",
  TermsLink: "https://www.keeva.dk/shop/soundboks-4-2#accordion-button167647_1",
  emailJsUserId: "iVXszx2CE7uZqq7r6",
  emailJsServiceId: "service_f2mk0nm",
  emailJsTemplateId: "template_gg154om",
  fallbackEmail: "sanfro04@gmail.com",
  bookingSubject: "Booking: Soundboks 4", //Hvis en mail sendes manuelt via. brugerens lokale mail.
  // Pricing rules: firstDay + thresholds for extra days
  pricing: {
    firstDay: 298, // Price for 1 day
    thresholds: [
      { minDays: 7, perDay: 150 },
      { minDays: 3, perDay: 200 }
    ]
  },
  // Stations with optional extra cost
  stations: {
    "Herning st.": 1000,
    "Vejle st.": 1000,
    "Ikast st.": 1000,
    "Give st.": 1000,
    "Silkeborg st.": 1500,
    "Holstebro st.": 1500
  }
};
</script>
<!-- ==================== END CONFIG ==================== -->

<title id="page-title">Lej</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
:root {
  --primary-color: #007bff;
  --success-color: #28a745;
  --bg-color: #f4f7f9;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0; padding: 20px;
  background-color: var(--bg-color);
  color: #333;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
}
.container {
  width: 100%; max-width: 500px;
  background: white; padding: 30px;
  border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  box-sizing: border-box;
}
h1 { margin-top:0; font-size:24px; text-align:center; }
h3 { font-size:16px; color:#666; margin:20px 0 10px 0; }
input[type="text"], input[type="time"], select {
  width: 100%; padding: 12px; border:1px solid #ddd;
  border-radius: 8px; font-size:16px; box-sizing:border-box; background:#fff;
}
.options { margin-bottom: 20px; }
.options label {
  display:flex; align-items:center; margin-bottom:12px; cursor:pointer; font-size:15px;
}
.options input[type="radio"] { margin-right:10px; }
#price { font-size:24px; font-weight:bold; color:#2c3e50; margin:25px 0; padding:15px;
        background:#f0f4f8; border-radius:8px; text-align:center; }
#send-btn { width:100%; background-color: var(--primary-color); color:white; padding:16px;
  border:none; border-radius:8px; cursor:pointer; font-size:18px; font-weight:bold; transition:0.2s;}
#send-btn:hover:not(:disabled){background-color:#0056b3;}
#send-btn:disabled{background-color:#cbd5e0; cursor:not-allowed;}
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  justify-content:center; align-items:center; z-index:1000; padding:20px; }
.modal-content { background:white; padding:25px; border-radius:12px; max-width:400px; width:100%;
  max-height:90vh; overflow-y:auto; }
.modal-content input, .modal-content textarea { width:100%; margin-bottom:12px; padding:12px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;}
.confirmation-box { display:flex; align-items:flex-start; gap:10px; margin:15px 0 20px 0; }
.confirmation-box input { width:auto!important; margin-top:3px!important; }
.confirmation-box label { font-size:13px; line-height:1.4; color:#555; }
.confirmation-box a { color: var(--primary-color); text-decoration:underline; }
#confirm-btn { width:100%; background-color: var(--success-color); color:white; padding:14px; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
#confirm-btn:disabled { background-color:#ccc; }
#success-modal .modal-content { text-align:center; }
.checkmark { font-size:50px; color: var(--success-color); }
#fail-modal .modal-content { text-align:center; }
#fail-modal textarea { font-family:monospace; height:250px; }
#fail-modal button { margin-top:10px; padding:12px; width:100%; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer; }
</style>
</head>
<body>

<div class="container">
  <h1 id="item-name">Røgmaskine</h1>
  <h3>1. Vælg lejeperiode</h3>
  <input type="text" id="calendar" placeholder="Vælg start- og slutdato..." readonly class="flatpickr-input active">

  <h3>2. Ønsket tidspunkt for afhentning/levering</h3>
  <input type="time" id="pickup-time" value="12:00">

  <h3>3. Levering eller afhentning</h3>
  <div class="options">
    <label><input type="radio" name="delivery" value="pickup" checked onclick="toggleDelivery()"> 🏠 Afhentning i Brande (0 DKK)</label>
    <label><input type="radio" name="delivery" value="delivery" onclick="toggleDelivery()"> 🚚 Levering til station</label>
    <div id="delivery-options" style="display:none; margin-top:10px;">
      <select id="location" onchange="updatePrice(); checkForm();">
        <option value="">-- Vælg station --</option>
      </select>
    </div>
  </div>
  <div id="price">Pris: 0 DKK</div>
  <button id="send-btn" onclick="showModal()" disabled>Send anmodning</button>
</div>

<!-- Request modal with form -->
<div id="request-modal" class="modal">
  <div class="modal-content">
    <h2>Dine oplysninger</h2>
    <div id="summary" style="background:#f9f9f9; padding:12px; border-radius:6px; margin-bottom:15px; font-size:13px; line-height:1.5; border-left:4px solid var(--primary-color);"></div>
    
    <form id="booking-form">
      <input type="text" name="name" id="name" placeholder="Fulde navn">
      <input type="email" name="email" id="email" placeholder="Email">
      <input type="tel" name="phone" id="phone" placeholder="Telefonnummer">
      <input type="text" name="period" id="period" hidden>
      <input type="text" name="time" id="time" hidden>
      <input type="text" name="deliveryInfo" id="deliveryInfo" hidden>
      <input type="text" name="price" id="form-price" hidden>
      <input type="text" name="item" id="item" hidden>
      <input type="text" name="message" id="message" placeholder="Besked til udlejer (valgfri)">
      <div class="confirmation-box">
        <input type="checkbox" id="terms-check" onchange="checkConfirm()">
        <label for="terms-check">Jeg har læst og accepterer <a id="terms-link" href="#" target="_blank">lejevilkårene</a></label>
      </div>
      <input type="submit" id="confirm-btn" value="Bekræft og Send Mail" disabled>
    </form>
  </div>
</div>

<!-- Success modal -->
<div id="success-modal" class="modal">
  <div class="modal-content">
    <span class="checkmark">✓</span>
    <h2>Anmodning sendt!</h2>
    <p id="success-date" style="font-size:14px; color:#666;"></p>
    <button onclick="location.reload()">Luk</button>
  </div>
</div>

<!-- Failure modal -->
<div id="fail-modal" class="modal">
  <div class="modal-content">
    <h2>Email kunne ikke sendes automatisk</h2>
    <p>Kopier venligst oplysningerne og send manuelt:</p>
    <textarea id="fail-textarea" readonly></textarea>
    <button onclick="navigator.clipboard.writeText(document.getElementById('fail-textarea').value)">Kopier til clipboard</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
/* ==================== APPLY CONFIG ==================== */
document.getElementById('page-title').textContent = CONFIG.pageTitle;
document.getElementById('item-name').textContent = CONFIG.itemName;
document.getElementById('terms-link').href = CONFIG.TermsLink;
emailjs.init(CONFIG.emailJsUserId);

const stationSelect = document.getElementById('location');
Object.keys(CONFIG.stations).forEach(s=>{
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  stationSelect.appendChild(opt);
});
/* ==================== END CONFIG ==================== */

let selectedDates = [];
const fp = flatpickr("#calendar", {
  mode:"range", dateFormat:"d-m-Y", minDate:"today",
  onChange:(dates)=>{selectedDates=dates; updatePrice(); checkForm();}
});

function toggleDelivery() {
  const delivery = document.querySelector('input[name="delivery"]:checked').value;
  document.getElementById('delivery-options').style.display = delivery==='delivery' ? 'block' : 'none';
  updatePrice(); checkForm();
}

// Enhanced pricing calculation based on thresholds
function updatePrice() {
  if(selectedDates.length<2){document.getElementById('price').textContent='Pris: 0 DKK'; return 0;}
  const start = selectedDates[0], end = selectedDates[1];
  const days = Math.floor((end-start)/(1000*60*60*24))+1;
  
  let perDay = CONFIG.pricing.firstDay; // default for first day
  CONFIG.pricing.thresholds.sort((a,b)=>b.minDays-a.minDays); // Descending
  for(const t of CONFIG.pricing.thresholds){
    if(days>=t.minDays){ perDay = t.perDay; break; }
  }

  let total = CONFIG.pricing.firstDay + (days>1 ? (days-1)*perDay : 0);

  const delivery = document.querySelector('input[name="delivery"]:checked').value;
  if(delivery==='delivery'){
    const loc=document.getElementById('location').value;
    if(loc in CONFIG.stations) total += CONFIG.stations[loc];
  }
  document.getElementById('price').textContent=`Pris: ${total} DKK`;
  return total;
}

function checkForm(){
  const delivery=document.querySelector('input[name="delivery"]:checked').value;
  const location=document.getElementById('location').value;
  const valid=selectedDates.length===2 && (delivery!=='delivery' || location!=='');
  document.getElementById('send-btn').disabled=!valid;
}

function showModal(){
  const time=document.getElementById('pickup-time').value;
  const summary=`<b>Periode:</b> ${fp.formatDate(selectedDates[0],"d-m-Y")} - ${fp.formatDate(selectedDates[1],"d-m-Y")}<br>
                 <b>Ønsket tid:</b> kl. ${time}<br>
                 <b>Type:</b> ${document.querySelector('input[name="delivery"]:checked').value==='pickup' ? 'Afhentning' : 'Levering ('+document.getElementById('location').value+')'}<br>
                 <b>Total:</b> ${document.getElementById('price').textContent}`;
  document.getElementById('summary').innerHTML=summary;
  document.getElementById('period').value = `${fp.formatDate(selectedDates[0],"d-m-Y")} til ${fp.formatDate(selectedDates[1],"d-m-Y")}`;
  document.getElementById('time').value = time;
  document.getElementById('deliveryInfo').value = document.querySelector('input[name="delivery"]:checked').value==='pickup' ? 'Afhentning' : 'Levering til '+document.getElementById('location').value;
  document.getElementById('form-price').value=document.getElementById('price').textContent;
  document.getElementById('request-modal').style.display='flex';
  document.getElementById('item').value = CONFIG.itemName;
}

function checkConfirm(){
  const form=document.getElementById('booking-form');
  const valid=form.name.value.trim() && form.email.value.trim() && form.phone.value.trim() && document.getElementById('terms-check').checked;
  document.getElementById('confirm-btn').disabled=!valid;
}
['name','email','phone'].forEach(id=>{document.getElementById(id).addEventListener('input',checkConfirm);});

document.getElementById('booking-form').addEventListener('submit', function(e){
  e.preventDefault();
  const btn=document.getElementById('confirm-btn');
  btn.value='Sender...';
  emailjs.sendForm(CONFIG.emailJsServiceId, CONFIG.emailJsTemplateId, this)
  .then(()=>{
    btn.value='Bekræft og Send Mail';
    document.getElementById('request-modal').style.display='none';
    document.getElementById('success-date').textContent="Anmodning oprettet d. "+new Date().toLocaleDateString('da-DK');
    document.getElementById('success-modal').style.display='flex';
  })
  .catch(()=>{
    btn.value = 'Bekræft og Send Mail';
    document.getElementById('request-modal').style.display = 'none';

    const mailText =
`Item: ${CONFIG.itemName}
Navn: ${this.name.value}
Email: ${this.email.value}
Telefon: ${this.phone.value}

Periode: ${this.period.value}
Ønsket tid: ${this.time.value}
Type: ${this.deliveryInfo.value}
Total Pris: ${this.price.value}

Besked: ${this.message.value}`;

    document.getElementById('fail-textarea').value = mailText;
    document.getElementById('fail-modal').style.display = 'flex';

    openMailClient(CONFIG.bookingSubject, mailText);
  });
});

window.onclick=function(e){if(e.target.className==='modal') e.target.style.display='none';};

function openMailClient(subject, body) {
  const mailto = `mailto:${CONFIG.fallbackEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}
</script>
</body>
</html>
